name: Pre-commit

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: batch_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d batch_gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Go tools (goimports, gosec, ruleguard)
        run: make install-pre-commit-tools

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      - name: Run integration tests
        run: make test-integration

      - name: Run PostgreSQL-backed tests
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/batch_gateway_test?sslmode=disable
        run: make test-postgres

      - name: Lint Helm chart
        run: |
          helm lint charts/batch-gateway
          for f in charts/batch-gateway/ci/values-*.yaml; do
            helm lint charts/batch-gateway -f "$f"
          done
