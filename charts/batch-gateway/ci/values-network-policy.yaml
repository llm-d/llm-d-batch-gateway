# Exercises: the API server NetworkPolicy with a peer for each port.
global:
  fileClient:
    fs:
      pvcName: "batch-data"
apiserver:
  networkPolicy:
    enabled: true
    api:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: my-gateway
    observability:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
