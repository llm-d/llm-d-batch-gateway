{{- if .Values.gc.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "batch-gateway.gc.fullname" . }}-config
  labels:
    {{- include "batch-gateway.gc.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Garbage Collector configuration
    dry_run: {{ .Values.gc.config.dryRun }}
    collector:
      interval: {{ .Values.gc.config.collector.interval | quote }}
      max_concurrency: {{ .Values.gc.config.collector.maxConcurrency }}
    metrics_addr: {{ .Values.gc.config.metricsAddr | quote }}
    db_client:
      type: {{ .Values.global.dbClient.type | quote }}
    file_client:
      type: {{ .Values.global.fileClient.type | quote }}
      fs:
        base_path: {{ .Values.global.fileClient.fs.basePath | quote }}
      s3:
        region: {{ .Values.global.fileClient.s3.region | quote }}
        bucket: {{ .Values.global.fileClient.s3.bucket | quote }}
        endpoint: {{ .Values.global.fileClient.s3.endpoint | quote }}
        access_key_id: {{ .Values.global.fileClient.s3.accessKeyId | quote }}
        prefix: {{ .Values.global.fileClient.s3.prefix | quote }}
        use_path_style: {{ .Values.global.fileClient.s3.usePathStyle }}
        auto_create_bucket: {{ .Values.global.fileClient.s3.autoCreateBucket }}
      retry:
        max_retries: {{ .Values.global.fileClient.retry.maxRetries }}
        initial_backoff: {{ .Values.global.fileClient.retry.initialBackoff | quote }}
        max_backoff: {{ .Values.global.fileClient.retry.maxBackoff | quote }}
    reconciler:
      enabled: {{ .Values.gc.config.reconciler.enabled }}
      interval: {{ .Values.gc.config.reconciler.interval | quote }}
      processor_label_selector: {{ include "batch-gateway.processor.selectorLabelsFlat" . | quote }}
      processor_statefulset: {{ include "batch-gateway.processor.fullname" . | quote }}
{{- end }}
