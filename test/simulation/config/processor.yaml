# Simulation harness processor config with compressed intervals.
# See docs/design/consistency-harness.md.
task_wait_time: "500ms"
poll_interval: "1s"
num_workers: 4

concurrency:
  global: 20
  per_endpoint: 5
  recovery: 2
  aimd:
    enabled: false

addr: ":9090"
terminate_on_observability_failure: false
shutdown_timeout: "10s"

# Refreshed every second so the reconciler (5s staleness threshold) never
# mistakes a live job for an orphan under normal operation.
heartbeat_interval: "1s"

work_dir: "/tmp/processor"

global_inference_gateway:
  url: "http://vcr:8000"
  request_timeout: "2m"
  max_retries: 1
  initial_backoff: "1s"
  max_backoff: "5s"

default_output_expiration_seconds: 3600
progress_ttl_seconds: 600

db_client:
  type: "postgresql"

file_client:
  type: "s3"
  s3:
    region: "us-east-1"
    bucket: "batch-gateway"
    endpoint: "http://toxiproxy:39000"
    access_key_id: "sim-access-key"
    use_path_style: true
    auto_create_bucket: true
