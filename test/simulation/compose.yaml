# Consistency simulation harness topology (docs/design/consistency-harness.md).
# Real stores, real gateway binaries built with the failpoints tag, and a
# GPU-free vllm-vcr model server (real vLLM Rust frontend, simulated engine).
#
# Interpolated variables, set by the Go test runner per scenario:
#   APISERVER_FAILPOINTS / PROCESSOR_FAILPOINTS / GC_FAILPOINTS  arm failpoints
#   PROCESSOR_CONFIG   config file under ./config (default processor.yaml)
#   VCR_IMAGE          vllm-vcr image (default ghcr.io/neuralmagic/vllm-vcr:dev)
#   SIM_MODEL          HF model id served by the vcr frontend (tokenizer only)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: ${SIM_PG_PASSWORD:?generated by the harness}
      POSTGRES_DB: batchgw
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d batchgw"]
      interval: 1s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  minio:
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: sim-access-key
      MINIO_ROOT_PASSWORD: ${SIM_S3_SECRET_KEY:?generated by the harness}
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 1s
      timeout: 2s
      retries: 30

  vcr:
    image: ${VCR_IMAGE:-ghcr.io/neuralmagic/vllm-vcr:dev}
    environment:
      MODEL: ${SIM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      # Latency model: ~200ms to first token, ~30ms per token. With
      # max_tokens around 100 a request takes a few seconds, long enough to
      # observe and interrupt jobs mid-execution.
      MOCK_TTFT_MS: ${SIM_TTFT_MS:-200}
      MOCK_ITL_MS: ${SIM_ITL_MS:-30}
    ports:
      - "18001:8000"
    volumes:
      - hf-cache:/tmp/hf
    healthcheck:
      # The runtime image has no curl; probe the port with bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 2s
      timeout: 2s
      retries: 90
      start_period: 30s

  # Every gateway-component store connection is routed through toxiproxy on a
  # per-component-per-store proxy (config/toxiproxy.json), so the runner can
  # partition e.g. only apiserver<->redis. The control API is on host :18474.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./config/toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "18474:8474"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "13200:3200"

  apiserver:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.apiserver
      args:
        GO_BUILD_TAGS: failpoints
    command: ["-config", "/etc/batch-gateway/config.yaml"]
    environment:
      FAILPOINTS: ${APISERVER_FAILPOINTS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SYNC_SPAN_EXPORT: "true"
      OTEL_SERVICE_NAME: batch-apiserver
    volumes:
      - ./config/apiserver.yaml:/etc/batch-gateway/config.yaml:ro
      - ./secrets/apiserver:/etc/.secrets:ro
    ports:
      - "18080:8000"
    depends_on:
      toxiproxy:
        condition: service_healthy

  processor:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.processor
      args:
        GO_BUILD_TAGS: failpoints
    command: ["-config", "/etc/batch-gateway/config.yaml"]
    environment:
      FAILPOINTS: ${PROCESSOR_FAILPOINTS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SYNC_SPAN_EXPORT: "true"
      OTEL_SERVICE_NAME: batch-processor
    volumes:
      - ./config/${PROCESSOR_CONFIG:-processor.yaml}:/etc/batch-gateway/config.yaml:ro
      - ./secrets/processor:/etc/.secrets:ro
    tmpfs:
      - /tmp
    depends_on:
      toxiproxy:
        condition: service_healthy
      vcr:
        condition: service_healthy

  gc:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.gc
      args:
        GO_BUILD_TAGS: failpoints
    command: ["-config", "/etc/batch-gateway/config.yaml"]
    environment:
      FAILPOINTS: ${GC_FAILPOINTS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SYNC_SPAN_EXPORT: "true"
      OTEL_SERVICE_NAME: batch-gc
    volumes:
      - ./config/gc.yaml:/etc/batch-gateway/config.yaml:ro
      - ./secrets/gc:/etc/.secrets:ro
    depends_on:
      toxiproxy:
        condition: service_healthy

volumes:
  hf-cache:
