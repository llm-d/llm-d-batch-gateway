ap:
  imagePullPolicy: Never
  transport: "redis-sortedset"
  concurrency: 1
  prometheusCacheTTL: "0s"
  otel:
    endpoint: "http://jaeger.default.svc.cluster.local:4317"
    insecure: true
    sampler: "always_on"
    samplerArg: "1.0"
  metrics:
    enabled: true
    port: 9090
    secure: false
  transportConfig:
    urlSecret:
      url: "redis://redis-master.default.svc.cluster.local:6379"
    result_queue_name: "result-list"
    poll_interval_ms: 500
    batch_size: 10
    claim_lease_ttl_seconds: 3
    claim_reclaim_interval_ms: 500
    queues:
      - queue_name: "llm-d-async:requests:sim-pool"
        request_path_url: "/v1/completions"
        igw_base_url: "http://vllm-sim.default.svc.cluster.local:8000"
        gate_type: "redis"
        gate_params:
          address: "redis-master.default.svc.cluster.local:6379"
      - queue_name: "llm-d-async:requests:sim-pool-b"
        request_path_url: "/v1/completions"
        igw_base_url: "http://vllm-sim-b.default.svc.cluster.local:8000"
        gate_type: "redis"
        gate_params:
          address: "redis-master.default.svc.cluster.local:6379"
      - queue_name: "llm-d-async:requests:sim-pool-gate"
        request_path_url: "/v1/completions"
        igw_base_url: "http://vllm-sim.default.svc.cluster.local:8000"
        gate_type: "redis"
        gate_params:
          address: "redis-master.default.svc.cluster.local:6379"
      # Per-tenant rate limit keyed on the userid metadata the processor sets
      # (tenantMetadataKey in processor-async-values.yaml).
      - queue_name: "llm-d-async:requests:sim-pool-quota"
        request_path_url: "/v1/completions"
        igw_base_url: "http://vllm-sim.default.svc.cluster.local:8000"
        gate_type: "redis-quota"
        gate_params:
          address: "redis-master.default.svc.cluster.local:6379"
          mode: "rate-limit"
          limit: "1"
          window: "10s"
  modelServerMonitor:
    enabled: false
