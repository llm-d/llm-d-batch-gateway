processor:
  config:
    dispatchMode: async
    # Carry the job tenant to Async gates; the quota fixture below keys on it.
    tenantMetadataKey: userid
    modelGateways: null
    globalInferenceGateway: null
    asyncDispatch:
      resultPollTimeout: "30s"
      models:
        sim-model:
          inferencePoolName: "sim-pool"
        sim-model-b:
          inferencePoolName: "sim-pool-b"
        sim-model-gate:
          inferencePoolName: "sim-pool-gate"
        sim-model-inject:
          inferencePoolName: "sim-pool-inject"
        sim-model-quota:
          inferencePoolName: "sim-pool-quota"
